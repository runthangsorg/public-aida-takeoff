version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8 supports TypeScript below 6.1 only; a TypeScript
      # major fails npm ci with ERESOLVE (as #2 did). Unignore when it widens.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types track the Node version CI runs on.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
